<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Echo of Self - 과거의 나</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-wrapper">
    <!-- Header UI -->
    <header id="header">
      <div class="level-badge" id="level-title">STAGE 1</div>
      <div class="loop-info">
        <span class="loop-icon">⏳</span>
        <span id="loop-count">LOOP 1</span>
      </div>
    </header>

    <!-- Main Game Canvas Area -->
    <div id="canvas-container">
      <canvas id="gameCanvas" width="800" height="450"></canvas>
      
      <!-- Overlay Messages -->
      <div id="ui-overlay" class="overlay hidden">
        <div class="overlay-content">
          <h1 id="overlay-title">STAGE CLEAR</h1>
          <p id="overlay-quote">"지나온 모든 걸음이 모여 마침내 문을 엽니다."</p>
          <button id="overlay-btn" class="btn primary">다음 단계를 향해</button>
        </div>
      </div>
    </div>

    <!-- Controls & Instructions -->
    <footer id="footer">
      <div class="controls-hint pc-hint">
        <span><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> 이동</span>
        <span><kbd>Space</kbd> / <kbd>W</kbd> 점프</span>
        <span><kbd>R</kbd> 루프 (과거의 나 생성)</span>
      </div>
      
      <!-- On-Screen Touch Controls for Mobile -->
      <div id="touch-controls">
        <div class="touch-group left-group">
          <button id="btn-left" class="touch-btn">◀</button>
          <button id="btn-right" class="touch-btn">▶</button>
        </div>
        <div class="touch-group right-group">
          <button id="btn-jump" class="touch-btn action-btn">JUMP</button>
          <button id="btn-rewind" class="touch-btn rewind-btn">LOOP (R)</button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Scripts Loading in Order -->
  <script src="js/stages.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/objects.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="main.js"></script>
</body>
</html>
